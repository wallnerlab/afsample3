name: Docker image

# Builds docker/Dockerfile, runs the CPU-only data pipeline test inside the new
# image and pushes it to Docker Hub only if the test passes.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with read/write scope).

on:
  # Run by hand from the Actions tab, or by pushing a version tag (e.g. v3.0.2).
  workflow_dispatch:
    inputs:
      skip_test:
        description: 'Push even if the data pipeline test is not run'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: docker-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: wallnerlab/afsample3

jobs:
  docker:
    name: Build, test and push
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    # The image (CUDA, JAX, chemical components database) needs more disk than
    # a fresh runner has free.
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker image prune --all --force
        df -h /

    - uses: actions/checkout@v5

    - uses: docker/setup-buildx-action@v3

    # latest: only from main or a version tag. gitYYYYMMDD: matches the existing
    # Docker Hub tags. sha-<commit>: exact source of the image.
    - name: Image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=git{{date 'YYYYMMDD'}}
          type=sha
          type=ref,event=tag

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64
        load: true
        tags: afsample3:test
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Data pipeline test
      if: ${{ !inputs.skip_test }}
      run: |
        docker run --rm -e JAX_PLATFORMS=cpu afsample3:test \
          python run_alphafold_data_test.py

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Same build inputs as above, so this reuses the builder's cache and only
    # uploads.
    - name: Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
